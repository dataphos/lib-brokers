name: PR CI

on:
  pull_request:
    branches: [ develop, main ]

env:
  GO111MODULE: on
  GO_VERSION: 1.19
  NODE_VERSION: 22
  LINT_ARGS: -v --timeout 5m0s --out-${NO_FUTURE}format colored-line-number
  TEST_ARGS: -v -short -coverprofile=coverage.out
  TEST_PATH: ./...

jobs:
  validate_pr_title_job:
    if: ${{ ! contains(github.head_ref, 'release-please--branches--main') }}
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          # Configure additional validation for the subject based on a regex.
          # This example ensures the subject doesn't start with an uppercase character.
          subjectPattern: ^(?![A-Z]).+$
          # If `subjectPattern` is configured, you can use this property to override
          # the default error message that is shown when the pattern doesn't match.
          # The variables `subject` and `title` can be used within the message.
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.

  editor_config_job:
    if: ${{ ! contains(github.head_ref, 'release-please--branches--main') }}
    name: Editor Config Job
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Editor Config
        run: |
          npm install --save-dev editorconfig-checker
          ./node_modules/.bin/editorconfig-checker

